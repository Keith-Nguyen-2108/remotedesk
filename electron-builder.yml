appId: com.keithnguyen.remotedesk
productName: RemoteDesk
copyright: Personal use only

directories:
  output: dist
  buildResources: build

files:
  - out/**
  - package.json

# nut.js ships a native .node binary; it must stay outside the asar archive.
asarUnpack:
  - '**/node_modules/@nut-tree-fork/**'

npmRebuild: true

afterPack: build/after-pack.js

mac:
  category: public.app-category.utilities
  icon: build/icon.png
  # Fixed names: the release keeps the same download URLs on every publish, and
  # the updater's manifest is generated against these exact filenames.
  artifactName: RemoteDesk-${arch}.${ext}
  target:
    # dmg is what a person installs from; the zip is what the in-app updater
    # downloads, because it can swap a .app bundle without a mounted image.
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  # electron-builder's own signing is off (it wants an Apple identity); the
  # bundle is signed in build/after-pack.js with the project's stable
  # self-signed certificate instead. That signature is what lets macOS honour
  # Screen Recording / Accessibility at all, and keep honouring them across
  # self-updates. Gatekeeper still needs right-click -> Open on first launch.
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  extendInfo:
    NSScreenCaptureUsageDescription: >-
      RemoteDesk shares this Mac's screen during a remote session you approve.
    NSAppleEventsUsageDescription: >-
      RemoteDesk controls this Mac's mouse and keyboard during a remote session you approve.

dmg:
  sign: false

win:
  icon: build/icon.png
  artifactName: RemoteDesk-Setup.${ext}
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
